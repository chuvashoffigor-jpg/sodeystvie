<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Страница не найдена — Содействие</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600;800&amp;display=swap" rel="stylesheet">
<style>
  html,body{height:100%;margin:0;}
  body{
    display:flex;align-items:center;justify-content:center;
    background:#f1f1f3;color:#0d1420;
    font-family:'Golos Text','Segoe UI',sans-serif;
    text-align:center;padding:24px;
  }
  .box{max-width:440px;}
  .code{font-weight:800;font-size:clamp(3rem,10vw,5rem);color:#1c4fd6;line-height:1;margin:0 0 8px;}
  h1{font-size:1.375rem;font-weight:700;margin:0 0 12px;}
  p{color:#69748a;line-height:1.55;margin:0 0 28px;}
  a.btn{
    display:inline-flex;align-items:center;justify-content:center;
    padding:.85em 1.8em;border-radius:999px;background:#0d1420;color:#fff;
    text-decoration:none;font-weight:700;font-size:.9375rem;
    transition:background-color .25s ease,transform .25s ease;
  }
  a.btn:hover{background:#1c4fd6;transform:translateY(-1px);}
</style>
</head>
<body>
  <div class="box">
    <p class="code">404</p>
    <h1>Такой страницы нет</h1>
    <p>Возможно, ссылка устарела или содержит опечатку. Проверьте адрес или вернитесь на главную.</p>
    <a class="btn" href="/">На главную</a>
  </div>
</body>
</html>
